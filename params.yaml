data_ingestion:
  image_size : (256 , 256)

model_building:
  weights : 'imagenet'
  input_shape : (256,256,3)
  include_top : False
  num_of_nodes : [64,128,256,512]
  optimizers : ["adam","nadam","rmsprop"]
  learning_rate : [1e-3,1e-4,1e-5]
  loss_function : "sparse_categorical_crossentropy"

model_training:
  tunner_epochs : 5
  earlystopping_monitor : "val_loss"
  model_train_epoch : 20
  training_batch_size : 23
                        