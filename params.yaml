data_ingestion:
  image_size : (256 , 256)

model_building:
  weights: 'imagenet'
  
  input_shape: [256, 256, 3]
  
  include_top: False
  
  num_of_nodes: [64, 128, 256, 512]
  
  optimizers: ["adam", "nadam", "rmsprop"]
  
  learning_rate: [0.001, 0.0001, 0.00001]
  
  loss_function: "sparse_categorical_crossentropy"
model_training:
  tunner_epochs : 5
  earlystopping_monitor : "val_loss"
  model_train_epoch : 10
  training_batch_size : 23
  mlflow_tracking_uri : "http://127.0.0.1:5000"
                        